databases:
  - name: farm360-db
    databaseName: farm360
    user: farm360_user
    plan: free

services:
  # FastAPI Web Backend
  - type: web
    name: farm360-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm360-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: PAYMENT_MODE
        value: sandbox
      - key: FEATURE_INVESTMENTS
        value: "false"
      - key: FEATURE_LAND_SALES
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9

  # Scheduled Worker (Work Order Scheduler)
  - type: worker
    name: farm360-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.services.work_order_scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm360-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9
