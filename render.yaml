services:
  # 1. PostgreSQL Database
  - type: database
    name: farm360-db
    databaseName: farm360
    user: farm360_user
    plan: free

  # 2. FastAPI Web Backend
  - type: web
    name: farm360-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm360-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://farm360.netlify.app  # Replace with your final Netlify URL
      - key: PYTHON_VERSION
        value: 3.11.9

  # 3. Scheduled Worker (Work Order Scheduler)
  - type: worker
    name: farm360-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.services.work_order_scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm360-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
